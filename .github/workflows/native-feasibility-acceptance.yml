name: Native feasibility acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed SHA matching both the selected dispatch ref and workflow revision
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Bind dispatch and workflow to the reviewed candidate before checkout
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: >-
          node -e 'const e = process.env;
          if (!/^[a-f0-9]{40}$/.test(e.CANDIDATE_SHA) ||
          e.GITHUB_EVENT_NAME !== "workflow_dispatch" ||
          e.GITHUB_SHA !== e.CANDIDATE_SHA ||
          e.GITHUB_WORKFLOW_SHA !== e.CANDIDATE_SHA)
          throw new Error("Reviewed dispatch/workflow binding mismatch");'

  acceptance:
    name: native-feasibility-acceptance-${{ matrix.platform }}
    needs: candidate
    environment: native-feasibility-provider-${{ matrix.platform }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            image: ubuntu-24.04
          - platform: darwin
            image: macos-15-intel
          - platform: win32
            image: windows-2025
    defaults:
      run:
        shell: bash
    env:
      NATIVE_PLATFORM: ${{ matrix.platform }}
      NATIVE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        timeout-minutes: 3
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: runtime
        timeout-minutes: 3
        with:
          node-version: 24.21.0
          architecture: x64
          check-latest: false
      - name: Initialize protected experiment reporting
        id: initialize
        timeout-minutes: 1
        run: node ci/native/feasibility/ci.js --stage initialize --platform "$NATIVE_PLATFORM" --expected-sha "$NATIVE_CANDIDATE_SHA" --protected
      - name: Prepare installed Linux tools
        id: prepare_linux
        if: ${{ matrix.platform == 'linux' }}
        timeout-minutes: 3
        run: |
          set +e
          printf 'operation=linux-package-update\nexit_code=\n' >> "$GITHUB_OUTPUT"
          sudo apt-get update
          status=$?
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          printf 'operation=linux-package-install\nexit_code=\n' >> "$GITHUB_OUTPUT"
          sudo apt-get install --no-install-recommends -y bubblewrap strace gcc-13
          status=$?
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Check installed Darwin tools and noninteractive observer authority
        id: prepare_darwin
        if: ${{ matrix.platform == 'darwin' }}
        timeout-minutes: 1
        run: node ci/native/feasibility/ci.js --stage prepare-darwin --platform "$NATIVE_PLATFORM" --expected-sha "$NATIVE_CANDIDATE_SHA" --protected
      # Native owners check audit/custody interfaces before command release.
      # Windows requires existing File System success auditing; never enable it here.
      - name: Select installed Windows x64 MSVC and SDK
        id: prepare_windows
        if: ${{ matrix.platform == 'win32' }}
        timeout-minutes: 2
        run: node ci/native/feasibility/ci.js --stage prepare-windows --platform "$NATIVE_PLATFORM" --expected-sha "$NATIVE_CANDIDATE_SHA" --protected
      - name: Establish credential-free native and model-free observations
        id: probe
        timeout-minutes: 12
        run: node ci/native/feasibility/ci.js --stage probe --platform "$NATIVE_PLATFORM" --expected-sha "$NATIVE_CANDIDATE_SHA" --protected
      - name: Verify environment protection and bounded model readiness
        id: readiness
        if: ${{ always() && steps.initialize.conclusion == 'success' }}
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_FEASIBILITY_REVIEWED_SHA: ${{ vars.NATIVE_FEASIBILITY_REVIEWED_SHA }}
          NATIVE_FEASIBILITY_MODEL_USE_AUTHORIZED: ${{ vars.NATIVE_FEASIBILITY_MODEL_USE_AUTHORIZED }}
          NATIVE_FEASIBILITY_CODEX_POLICY: ${{ vars.NATIVE_FEASIBILITY_CODEX_POLICY }}
          NATIVE_FEASIBILITY_CLAUDE_POLICY: ${{ vars.NATIVE_FEASIBILITY_CLAUDE_POLICY }}
        run: node ci/native/feasibility/ci.js --stage readiness --platform "$NATIVE_PLATFORM" --expected-sha "$NATIVE_CANDIDATE_SHA" --protected
      - name: Protected acceptance requires independently admitted native custody
        if: ${{ always() && steps.readiness.conclusion == 'success' && steps.readiness.outputs.ready == 'true' }}
        timeout-minutes: 5
        env:
          NATIVE_CODEX_MODEL_CREDENTIAL: ${{ secrets.NATIVE_CODEX_MODEL_CREDENTIAL }}
          NATIVE_CLAUDE_MODEL_CREDENTIAL: ${{ secrets.NATIVE_CLAUDE_MODEL_CREDENTIAL }}
        run: node ci/native/feasibility/ci.js --stage protected --platform "$NATIVE_PLATFORM" --expected-sha "$NATIVE_CANDIDATE_SHA" --protected
      - name: Audit independently observed owned cleanup
        id: cleanup
        if: ${{ always() && steps.initialize.conclusion == 'success' }}
        timeout-minutes: 1
        run: node ci/native/feasibility/ci.js --stage cleanup --platform "$NATIVE_PLATFORM" --expected-sha "$NATIVE_CANDIDATE_SHA" --protected
      - name: Report and enforce protected evidence
        if: ${{ always() }}
        timeout-minutes: 1
        env:
          NATIVE_PREPARATION_CONCLUSION: ${{ matrix.platform == 'win32' && steps.prepare_windows.conclusion || matrix.platform == 'darwin' && steps.prepare_darwin.conclusion || steps.prepare_linux.conclusion }}
          NATIVE_PREPARATION_OPERATION: ${{ steps.prepare_linux.outputs.operation || steps.prepare_darwin.outputs.operation || steps.prepare_windows.outputs.operation }}
          NATIVE_PREPARATION_EXIT_CODE: ${{ steps.prepare_linux.outputs.exit_code || steps.prepare_darwin.outputs.exit_code || steps.prepare_windows.outputs.exit_code }}
          NATIVE_PREPARATION_CAUSE: ${{ steps.prepare_darwin.outputs.cause || steps.prepare_windows.outputs.cause }}
          NATIVE_PREPARATION_CLEANUP_CAUSE: ${{ steps.prepare_windows.outputs.cleanup_cause }}
          NATIVE_PROBE_CONCLUSION: ${{ steps.probe.conclusion }}
          NATIVE_CLEANUP_CONCLUSION: ${{ steps.cleanup.conclusion }}
        run: |
          if [ -f ci/native/feasibility/ci.js ]; then
            node ci/native/feasibility/ci.js --stage report --platform "$NATIVE_PLATFORM" --expected-sha "$NATIVE_CANDIDATE_SHA" --protected
          else
            printf '%s\n' 'Protected feasibility reporting is unavailable after checkout failure; no passing evidence.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload only redacted reports
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-feasibility-acceptance-${{ matrix.platform }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/native-feasibility-report/report.json
            ${{ runner.temp }}/native-feasibility-report/summary.md
          if-no-files-found: error
          retention-days: 7
          overwrite: false
